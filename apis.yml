aid: astral
name: Astral
description: >-
  Astral (Astral Software Inc.) builds high-performance developer tools for the
  Python ecosystem, written in Rust. Its products are uv, an extremely fast
  Python package and project manager that replaces pip, pip-tools, pipx, poetry,
  pyenv, twine, and virtualenv; Ruff, an extremely fast Python linter and code
  formatter; and ty, a fast Python type checker and language server. Founded by
  Charlie Marsh (creator of Ruff) and backed by Accel, Caffeinated Capital, and
  angel investor Guillermo Rauch, Astral ships open-source command-line tooling
  distributed via PyPI, crates.io, npm, and Homebrew. In March 2026 Astral
  agreed to join OpenAI as part of the Codex team.
